<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Siege Quartermaster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Royal Siege Quartermaster</h1>
        <div class="header-right">
            <span id="turn-display">TURN 1/6</span>
            <button id="audio-toggle" type="button">SOUND: ON</button>
            <button id="reset-btn" type="button">RESET[R]</button>
        </div>
    </header>
    <main>
        <section class="battlefield">
            <div class="resources">
                <div class="res timber">TIMBER: <strong id="timber-val">4</strong></div>
                <div class="res iron">IRON: <strong id="iron-val">4</strong></div>
                <div class="res mana">MANA: <strong id="mana-val">3</strong></div>
            </div>
            <div id="lanes-list" class="lanes-list"></div>
            <div id="summary-banner" class="summary-banner hidden" aria-live="polite"></div>
            <div id="status-log" class="status-log">
                Select a lane and issue an order, or end the turn.
            </div>
        </section>
        <aside class="controls">
            <h2 id="selected-lane-label">LANE: NORTH GATE</h2>
            <button id="repair-btn" class="action-btn" type="button">
                [Q] Fortify Wall (-2 Timber) - +25 WALL HP
            </button>
            <button id="ballista-btn" class="action-btn" type="button">
                [W] Fire Ballista (-2 Iron) - 35 damage to Front Enemy
            </button>
            <button id="arcane-btn" class="action-btn" type="button">
                [E] Arcane Nova (-2 Mana) - 25 AoE Damage &amp; Stun
            </button>
            <button id="end-turn-btn" class="end-turn-btn" type="button">
                END TURN [SPACE]
            </button>
        </aside>
    </main>
    <script src="app.js"></script>
</body>
</html>
